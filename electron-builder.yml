appId: io.github.mrmanny.neo2flightpath
productName: Neo2 Flightpath
# The portable default would contain a space; keep artifact names shell-friendly.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
# The auto-update feed: electron-updater reads this repository's releases, and
# electron-builder generates app-update.yml and the latest*.yml update metadata
# from it (NSIS and AppImage builds carry them; portable never does).
publish:
  provider: github
  owner: MrManny
  repo: neo2-flightpath
directories:
  output: dist-electron
files:
  - dist/**
  - app/**
  - ui/out/**
  # The app never renders headless video; the CLI keeps using playwright-core.
  - "!node_modules/playwright-core/**"
  # The embedded ffmpeg/ffprobe binaries ship as extraResources: nothing may
  # spawn them from inside the asar.
  - "!node_modules/ffmpeg-ffprobe-static/**"
  # The window icon is read at runtime; build resources are not packed by default.
  - build/icon.ico
  - build/icons/256x256.png
  # License texts: the app's own and the embedded GPL binaries' (the latter
  # ship in resources/ff/ via extraResources).
  - LICENSE
  - THIRD-PARTY-NOTICES.md
# extraResources sources are silently skipped when absent; this hook fails the
# build when the embedded tools or their license text are missing.
afterPack: build/after-pack.cjs
# Static ffmpeg/ffprobe next to the app (resources/ff/, resolved via
# process.resourcesPath), downloaded into the optional dependency at install
# time along with the release's own GPL license text.
win:
  icon: build/icon.ico
  extraResources:
    - from: node_modules/ffmpeg-ffprobe-static/ffmpeg.exe
      to: ff/ffmpeg.exe
    - from: node_modules/ffmpeg-ffprobe-static/ffprobe.exe
      to: ff/ffprobe.exe
    - from: node_modules/ffmpeg-ffprobe-static/ffmpeg.exe.LICENSE
      to: ff/ffmpeg.exe.LICENSE
# NSIS is the default Windows target; without its own artifact name the setup
# exe would collide with the portable exe on the GitHub release.
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
linux:
  target: AppImage
  icon: build/icons
  extraResources:
    - from: node_modules/ffmpeg-ffprobe-static/ffmpeg
      to: ff/ffmpeg
    - from: node_modules/ffmpeg-ffprobe-static/ffprobe
      to: ff/ffprobe
    - from: node_modules/ffmpeg-ffprobe-static/ffmpeg.LICENSE
      to: ff/ffmpeg.LICENSE
