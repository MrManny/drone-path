name: Release

# Once the release checks pass, three ordered npm jobs and the independent
# desktop jobs run. Re-run failed jobs to resume at the first failed publish.
#
# Auth works in two phases (see README "Releasing"):
#   1. Bootstrap: publish the new package names manually or set NPM_TOKEN to
#      a granular token authorized to create them and publish this release.
#      The workflow uses the token with --provenance.
#   2. Trusted publishing: configure the trusted publisher for each package
#      on npmjs.com (workflow filename: release.yml), then delete
#      the NPM_TOKEN secret. With the secret gone, publishing switches to
#      token-free OIDC automatically (and provenance is generated by npm).
#
# Prerelease GitHub releases are skipped. The release tag must match the
# version in all three npm packages and the desktop app (leading "v" optional).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify the lockstep release tag
        run: node scripts/release-npm.mjs verify "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  publish-core:
    name: Publish drone-path-core to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: &npm-permissions
      contents: read
      id-token: write
    env:
      RELEASE_WORKSPACE: drone-path-core
    steps: &npm-publish-steps
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build publishable workspaces
        run: npm run build:cli

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --workspace "$RELEASE_WORKSPACE" --access public --provenance
          else
            npm publish --workspace "$RELEASE_WORKSPACE" --access public
          fi

  publish-engine:
    name: Publish drone-path-engine to npm
    needs: publish-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *npm-permissions
    env:
      RELEASE_WORKSPACE: drone-path-engine
    steps: *npm-publish-steps

  publish-cli:
    name: Publish drone-path to npm
    needs: publish-engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *npm-permissions
    env:
      RELEASE_WORKSPACE: drone-path
    steps: *npm-publish-steps

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: win-x64-nsis
            target: --win nsis
            # Installed apps read latest.yml from the release; the blockmap
            # gives them differential downloads. Each target builds in its own
            # job so only the NSIS build ever produces feed metadata.
            artifact: apps/desktop/dist-electron/*.exe apps/desktop/dist-electron/latest.yml apps/desktop/dist-electron/*.blockmap
          - os: windows-latest
            label: win-x64-portable
            target: --win portable
            artifact: apps/desktop/dist-electron/*.exe
          - os: ubuntu-latest
            label: linux-x86_64
            target: --linux AppImage
            artifact: apps/desktop/dist-electron/*.AppImage apps/desktop/dist-electron/latest-linux.yml
    steps:
      # Full history with tags: the About dialog's build identity must see the
      # v<version> tag on HEAD, or release builds would show a commit hash.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build desktop app
        run: npm run app:pack -- ${{ matrix.target }}

      - name: Attach artifact to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact }} --clobber
