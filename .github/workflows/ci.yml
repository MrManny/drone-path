name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lint and test gate the workflow: build verification, dry-run packs, and the
# desktop packaging smoke only run when the quality gate is green.

jobs:
  check:
    name: Lint and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - if: matrix.node-version == 24
        run: npm run lint
      - run: npm test

  package-smoke:
    name: Build, pack, and desktop packaging smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts --workspace drone-path-core
      - run: npm pack --dry-run --ignore-scripts --workspace drone-path-archive
      - run: npm pack --dry-run --ignore-scripts --workspace drone-path-engine
      - run: npm pack --dry-run --ignore-scripts --workspace drone-path
      - run: npm run app:pack -- --dir
      - name: Verify production dependencies in the desktop ASAR
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npm exec --workspace drone-path-desktop -- electron build/verify-asar.cjs dist-electron/linux-unpacked/resources/app.asar
      - name: Verify Electron security fuses on the packaged binary
        run: node apps/desktop/build/verify-fuses.cjs apps/desktop/dist-electron/linux-unpacked/drone-path
